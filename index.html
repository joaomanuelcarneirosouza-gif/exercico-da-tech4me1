<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Tabela de Alunos</title>
    <style>
        table {
            border-collapse: collapse;
            width: 400px;
            font-family: sans-serif;
        }

        th,
        td {
            border: 1px solid #999;
            padding: 8px;
            text-align: center;
        }

        th {
            background: #ddd;
        }

        .reprovado {
            background-color: red;
            color: white;
        }

        .aprovado {
            background-color: green;
            color: white;
        }
    </style>
</head>

<body>
    <script src="script.js"></script>
</body>

</html>
